services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storeapi-mssql
    environment:
      ACCEPT_EULA: "Y"
      # Required: compose refuses to start without a real password. Set it in .env.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or the environment}
      MSSQL_PID: Developer
    # The database port is intentionally not published; only the API reaches it, on the
    # internal compose network. Add a ports mapping locally if you need a SQL client.
    expose:
      - "1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storeapi-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mssql,1433;Database=StoreApiDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env or the environment};TrustServerCertificate=True
      # Required: no default signing key, so a deployment can never inherit a public secret.
      Jwt__Key: ${JWT__KEY:?Set JWT__KEY in .env to a unique secret of at least 32 characters}
      Jwt__Issuer: StoreApi
      Jwt__Audience: StoreApi.Clients
      Jwt__ExpiryMinutes: "60"
      Admin__Username: ${ADMIN__USERNAME:-admin}
      Admin__Email: ${ADMIN__EMAIL:?Set ADMIN__EMAIL in .env or the environment}
      Admin__Password: ${ADMIN__PASSWORD:?Set ADMIN__PASSWORD in .env or the environment}
    ports:
      - "5000:8080"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
