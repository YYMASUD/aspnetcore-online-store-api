name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: |
          **/bin/Release/
          **/obj/
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'
        retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate docker-compose
      run: docker compose config

    - name: Build Docker image
      run: docker build -t storeapi:ci .

    - name: Test Docker image
      run: |
        docker run -d --name storeapi-test -p 8080:80 \
          -e ConnectionStrings__DefaultConnection="Data Source=:memory:" \
          -e Jwt__Key="test-key-must-be-at-least-32-bytes-long-for-hs256" \
          -e Jwt__Issuer=TestIssuer \
          -e Jwt__Audience=TestAudience \
          -e Admin__Email=admin@test.com \
          -e Admin__Password=Admin#Passw0rd \
          storeapi:ci
        sleep 10
        curl --fail http://localhost:8080/health || exit 1
        docker stop storeapi-test
