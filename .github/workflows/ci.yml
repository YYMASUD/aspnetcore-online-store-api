name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore StoreApi.sln

      - name: Build
        run: dotnet build StoreApi.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test StoreApi.sln
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 7

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        env:
          MSSQL_SA_PASSWORD: 'YourStrong@Passw0rd'
          JWT__KEY: 'ci-signing-key-must-be-at-least-32-bytes-long'
          ADMIN__EMAIL: 'admin@storeapi.local'
          ADMIN__PASSWORD: 'Admin#Passw0rd'
        run: docker compose config

      - name: Build image
        run: docker build -t storeapi:ci .

      - name: Start stack
        env:
          MSSQL_SA_PASSWORD: 'YourStrong@Passw0rd'
          JWT__KEY: 'ci-signing-key-must-be-at-least-32-bytes-long'
          ADMIN__EMAIL: 'admin@storeapi.local'
          ADMIN__PASSWORD: 'Admin#Passw0rd'
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          docker compose logs
          exit 1

      - name: Verify Swagger endpoint
        run: curl --fail --silent --output /dev/null http://localhost:5000/swagger/v1/swagger.json

      - name: Dump logs on failure
        if: failure()
        env:
          MSSQL_SA_PASSWORD: 'YourStrong@Passw0rd'
          JWT__KEY: 'ci-signing-key-must-be-at-least-32-bytes-long'
          ADMIN__EMAIL: 'admin@storeapi.local'
          ADMIN__PASSWORD: 'Admin#Passw0rd'
        run: docker compose logs

      - name: Tear down
        if: always()
        env:
          MSSQL_SA_PASSWORD: 'YourStrong@Passw0rd'
          JWT__KEY: 'ci-signing-key-must-be-at-least-32-bytes-long'
          ADMIN__EMAIL: 'admin@storeapi.local'
          ADMIN__PASSWORD: 'Admin#Passw0rd'
        run: docker compose down -v
